<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — ShopNest</title>
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="cart.css">
</head>
<body>

<div class="bg-blobs"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="logo">S</div>
    <span>ShopNest</span>
  </div>
  <ul class="sidebar-nav">
    <li><a href="../dashboard/dashboard.html"><span class="icon">🏠</span> Dashboard</a></li>
    <li><a href="../products/products.html"><span class="icon">📦</span> Products</a></li>
    <li><a href="../categories/categories.html"><span class="icon">🏷️</span> Categories</a></li>
    <li><a href="../orders/orders.html"><span class="icon">🛒</span> Orders</a></li>
    <li><a href="../cart/cart.html" class="active"><span class="icon">🛍️</span> Shopping Cart</a></li>
    <li><a href="../payments/payments.html"><span class="icon">💳</span> Payments</a></li>
  </ul>
  <div class="sidebar-footer">
    <a href="#" onclick="logout()"><span class="icon">🚪</span> Logout</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main-content">
  <div class="topbar">
    <h1><span>Shopping Cart</span> 🛍️</h1>
    <div class="topbar-actions">
      <button class="btn btn-danger btn-sm" onclick="clearCart()" id="clearBtn" style="display:none">🗑️ Clear Cart</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon pink">🛍️</div>
      <div class="stat-info">
        <h3 id="itemCount">0</h3>
        <p>Items in Cart</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">💰</div>
      <div class="stat-info">
        <h3 id="cartTotal">$0.00</h3>
        <p>Estimated Total</p>
      </div>
    </div>
  </div>

  <!-- CART ITEMS -->
  <div class="glass-card" id="cartContainer">
    <div class="loader"><div class="spinner"></div></div>
  </div>

  <!-- ADD PRODUCTS TO CART -->
  <div class="glass-card" style="margin-top:1.5rem">
    <div class="table-header">
      <h2>Add Products</h2>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="prodSearchInput" placeholder="Search products…">
      </div>
    </div>
    <div id="productBrowser" style="max-height:300px;overflow-y:auto">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- CHECKOUT -->
  <div class="checkout-bar glass-card" id="checkoutBar" style="display:none">
    <div class="checkout-info">
      <h3>Ready to Checkout?</h3>
      <p>Review your items and proceed to payment</p>
    </div>
    <div class="checkout-total">
      <span id="checkoutTotal">$0.00</span>
    </div>
    <button class="btn btn-primary" onclick="proceedToCheckout()">Proceed to Checkout →</button>
  </div>
</main>

<script src="../shared/shared.js"></script>
<script src="cart.js"></script>
</body>
</html>
